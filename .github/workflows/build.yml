name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK" ]]; then
            echo "::error::Android SDK not found"
            exit 1
          fi
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -1)"
          if [[ -z "$SDKMGR" ]]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMGR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Fetch Ghidra 12.2
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch Ghidra_12.2_build \
            https://github.com/NationalSecurityAgency/ghidra \
            third_party/ghidra
          cd third_party/ghidra
          git sparse-checkout set \
            Ghidra/Features/Decompiler/src/decompile/cpp \
            Ghidra/Processors/x86/data/languages \
            Ghidra/Processors/ARM/data/languages \
            Ghidra/Processors/AARCH64/data/languages
          git rev-parse HEAD

      - name: Build SLEIGH compiler and processor specs
        run: ./scripts/build-specs.sh

      - name: Stage Ghidra assets
        run: ./scripts/stage-assets.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.VELLA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VELLA_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.VELLA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VELLA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo "::error::Missing VELLA_KEYSTORE_B64 repository secret"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          if [[ -z "$UNSIGNED" ]]; then
            echo "::error::No unsigned release APK found"
            exit 1
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out vella.apk \
            aligned.apk
          "$BT/apksigner" verify --verbose --print-certs vella.apk | tee apk-signature.txt

      - name: Inspect APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging vella.apk | tee apk-badging.txt | head -25
          unzip -l vella.apk | grep -E 'lib/arm64-v8a/libvella.so|assets/ghidra' | head -20
          unzip -p vella.apk lib/arm64-v8a/libvella.so > libvella.so
          file libvella.so
          ls -l vella.apk
          sha256sum vella.apk | tee vella.apk.sha256

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Automated Vella build from `${GITHUB_SHA::12}`.
          Ghidra 12.2 decompiler engine, arm64-v8a.
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" vella.apk vella.apk.sha256 apk-badging.txt apk-signature.txt --clobber
            else
              gh release create "$TAG" vella.apk vella.apk.sha256 apk-badging.txt apk-signature.txt \
                --title "Vella $TAG" --notes "$NOTES"
            fi
          else
            if gh release view ci-latest > /dev/null 2>&1; then
              gh release upload ci-latest vella.apk vella.apk.sha256 apk-badging.txt apk-signature.txt --clobber
            else
              gh release create ci-latest vella.apk vella.apk.sha256 apk-badging.txt apk-signature.txt \
                --prerelease --title "Latest CI build" --notes "$NOTES"
            fi
          fi
